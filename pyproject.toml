[project]
name = "frivillighet-i-oslo"
version = "0.1.0"
description = "Streamlit-app for å finne frivillige organisasjoner i Oslo, filtrert per bydel."
authors = [{ name = "Frederick Nilsen" }]
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pylint>=4.0.5",
    "requests>=2.34.2",
    "ruff>=0.15.16",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pylint.master]
ignore = ".venv"

[tool.pylint.messages_control]
disable = ["C0114", "C0116"]

[tool.pylint.basic]
const-rgx = "^([A-Z_][A-Z0-9_]*|[a-z_][a-z0-9_]*)$"

[tool.pylint.format]
max-line-length = 120
